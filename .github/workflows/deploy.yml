name: Build and Deploy FC.io

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      deploy_only:
        description: 'Deploy only (skip build)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !inputs.deploy_only }}
    outputs:
      build_timestamp: ${{ steps.timestamp.outputs.timestamp }}
      build_required: ${{ steps.check_changes.outputs.build_required }}
    
    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Generate build timestamp
        id: timestamp
        run: echo "timestamp=$(date +%Y%m%d_%H%M%S)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Install SSH client
        run: sudo apt-get install -y openssh-client

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Check for build-related changes
        id: check_changes
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "[[ -f /var/www/fc.io/deploy/last_deployed_commit ]] && echo 'yes' || echo 'no'" > last_deployed_commit.txt

          if [ -f last_deployed_commit.txt ]; then
            if grep -q "yes" last_deployed_commit.txt; then
              ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
                cd /var/www/fc.io
                git fetch origin master
                LAST_DEPLOYED_COMMIT=$(cat deploy/last_deployed_commit)
                if git diff --name-only "$LAST_DEPLOYED_COMMIT" origin/master | grep -E '(docker-compose\.yml|docker-compose\.prod\.yml|^docker/|^public-ui/|^dashboard-ui/|^api/)'; then
                  echo "true" > /tmp/build_required.txt
                else
                  echo "false" > /tmp/build_required.txt
                fi
              "
            else
              ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo 'true' > /tmp/build_required.txt"
            fi
          fi

          BUILD_REQUIRED=$(ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "cat /tmp/build_required.txt")
          echo "build_required=$BUILD_REQUIRED" >> $GITHUB_OUTPUT

      - name: Create deployment package
        if: steps.check_changes.outputs.build_required == 'true'
        run: |
          # Create deployment artifact directory
          mkdir -p deployment-package
          
          # Copy essential files for deployment
          cp -r docker/ deployment-package/
          cp -r public-ui/ deployment-package/
          cp -r dashboard-ui/ deployment-package/
          cp -r api/ deployment-package/
          cp docker-compose.yml deployment-package/
          cp docker-compose.prod.yml deployment-package/
          cp env.production deployment-package/
          cp start.sh deployment-package/
          
          # Create build info
          echo "BUILD_TIMESTAMP=${{ steps.timestamp.outputs.timestamp }}" > deployment-package/build-info.env
          echo "COMMIT_SHA=${{ github.sha }}" >> deployment-package/build-info.env
          echo "BUILD_NUMBER=${{ github.run_number }}" >> deployment-package/build-info.env
          
          # Create deployment package
          tar -czf fc-io-deployment-${{ steps.timestamp.outputs.timestamp }}.tar.gz deployment-package/

      - name: Upload deployment artifact
        if: steps.check_changes.outputs.build_required == 'true'
        uses: actions/upload-artifact@v3
        with:
          name: fc-io-deployment-${{ steps.timestamp.outputs.timestamp }}
          path: fc-io-deployment-${{ steps.timestamp.outputs.timestamp }}.tar.gz
          retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    if: always() && (needs.build.result == 'success' || inputs.deploy_only)
    
    steps:
      - name: Checkout the code (for deploy-only mode)
        if: inputs.deploy_only
        uses: actions/checkout@v3

      - name: Download deployment artifact
        if: needs.build.outputs.build_required == 'true' && !inputs.deploy_only
        uses: actions/download-artifact@v3
        with:
          name: fc-io-deployment-${{ needs.build.outputs.build_timestamp }}

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server using artifacts
        run: |
          # Upload artifact if we have one
          if [[ "${{ needs.build.outputs.build_required }}" == "true" ]] && [[ "${{ inputs.deploy_only }}" != "true" ]]; then
            echo "Uploading deployment artifact..."
            scp -o StrictHostKeyChecking=no fc-io-deployment-${{ needs.build.outputs.build_timestamp }}.tar.gz "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/"
          fi
          
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            cd /var/www/fc.io
            
            # Handle artifact-based deployment
            if [[ -f /tmp/fc-io-deployment-${{ needs.build.outputs.build_timestamp }}.tar.gz ]]; then
              echo "Using deployment artifact for fast deployment..."
              
              # Extract artifact
              cd /tmp
              tar -xzf fc-io-deployment-${{ needs.build.outputs.build_timestamp }}.tar.gz
              
              # Stop services
              cd /var/www/fc.io && ./start.sh stop
              
              # Replace with artifact content
              rsync -av --delete /tmp/deployment-package/ /var/www/fc.io/
              cd /var/www/fc.io
              
              # Set up environment
              cp env.production .env
              source build-info.env
              
              echo "Deploying artifact: Build \$BUILD_NUMBER, Commit \$COMMIT_SHA, Timestamp \$BUILD_TIMESTAMP"
              
              # Clean up and deploy
              docker builder prune -f
              ./start.sh prod
              
              # Cleanup
              rm -f /tmp/fc-io-deployment-*.tar.gz
              rm -rf /tmp/deployment-package
              
              echo "Artifact-based deployment completed in seconds!"
            else
              echo "No artifact found, using git-based deployment..."
              git fetch origin master && git reset --hard origin/master && git clean -fd
              cp env.production .env
              ./start.sh restart
            fi

            git rev-parse HEAD > deploy/last_deployed_commit
          "