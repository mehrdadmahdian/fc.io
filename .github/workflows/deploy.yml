name: Deploy Dockerized App

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Install SSH client
        run: sudo apt-get install -y openssh-client

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Check for build-related changes on server
        id: check_changes
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "[[ -f /var/www/fc.io/deploy/last_deployed_commit ]] && echo 'yes' || echo 'no'" > last_deployed_commit.txt

          if [ -f last_deployed_commit.txt ]; then
            if grep -q "yes" last_deployed_commit.txt; then
              ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
                cd /var/www/fc.io
                git fetch origin master
                LAST_DEPLOYED_COMMIT=$(cat deploy/last_deployed_commit)
                if git diff --name-only "$LAST_DEPLOYED_COMMIT" origin/master | grep -E '(docker-compose\.yml|docker-compose\.prod\.yml|^docker/|^public-ui/|^dashboard-ui/|^api/)'; then
                  echo "true" > /tmp/build_required.txt
                else
                  echo "false" > /tmp/build_required.txt
                fi
              "
            else
              ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "echo 'true' > /tmp/build_required.txt"
            fi
          fi

          BUILD_REQUIRED=$(ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "cat /tmp/build_required.txt")
          echo "build_required=$BUILD_REQUIRED" >> $GITHUB_ENV

      - name: Deploy to server using start.sh script
        run: |
          ssh -o StrictHostKeyChecking=no "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "
            cd /var/www/fc.io
            git fetch origin master && git reset --hard origin/master && git clean -fd
            
            # Set up environment file for production
            cp env.production .env
            
            if [[ "${{ env.build_required }}" == "true" ]]; then
              echo "Build-related changes detected. Stopping and rebuilding containers."
              ./start.sh stop
              
              # Clean up any potentially cached layers
              docker builder prune -f
              
              # Start production environment with rebuild
              ./start.sh prod
              
              echo "Deployment completed with rebuild using start.sh"
            else
              echo "No build-related changes detected. Restarting existing containers."
              ./start.sh restart
            fi

            git rev-parse HEAD > deploy/last_deployed_commit
          "