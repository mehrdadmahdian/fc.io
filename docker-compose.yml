services:
  nginx:
    build: 
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    container_name: nginx-container
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    volumes:
      - ./docker/nginx/conf.d/:/etc/nginx/templates/
    depends_on:
      public-ui:
        condition: service_healthy
      dashboard-ui:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fc-network

  api:
    build: 
      context: .
      dockerfile: ./docker/api/Dockerfile
      target: ${APP_ENV:-production}
      args:
        API_SERVER_PORT: ${API_SERVER_PORT}
    container_name: api-container
    ports:
      - "127.0.0.1:${API_SERVER_PORT}:${API_SERVER_PORT}"
    env_file:
      - .env
    volumes:
      - ${LOG_PATH:-./logs}:/var/log/
      - ${SESSION_PATH:-./sessions}:/var/sessions/
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - fc-network

  dashboard-ui:
    build:
      context: .
      dockerfile: docker/dashboard-ui/Dockerfile
      target: ${APP_ENV:-production}
      args:
        REACT_APP_API_BASE_URL: ${API_URL}
    container_name: dashboard-ui-container
    ports:
      - "127.0.0.1:${DASHBOARD_UI_SERVER_PORT}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - fc-network

  public-ui:
    build:
      context: .
      dockerfile: docker/public-ui/Dockerfile
      target: ${APP_ENV:-production}
      args:
        NEXT_PUBLIC_API_URL: ${API_URL}
    container_name: public-ui-container
    ports:
      - "127.0.0.1:${PUBLIC_UI_SERVER_PORT}:3000"
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - fc-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "127.0.0.1:${REDIS_SERVER_PORT}:6379"
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fc-network

  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_PORT}:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASS}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    volumes:
      - ./docker/mongodb/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fc-network

  mongo-express:
    image: mongo-express:1-20-alpine3.18
    container_name: mongo-express
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_EXPRESS_PORT}:8081"
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - fc-network

networks:
  fc-network:
    driver: bridge

volumes:
  redis_data:
    driver: local
  mongo_data:
    driver: local
  dashboard_ui_cache:
    driver: local