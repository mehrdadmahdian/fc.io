services:
  nginx:
    ports:
      # Add HTTPS port for production
      - "443:443"
    volumes:
      # Mount SSL certificates for production (if available)
      - /etc/ssl/private:/etc/ssl/private:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
        reservations:
          memory: 64M

  api:
    build:
      target: production
    # Keep essential production volumes for logs and sessions
    volumes:
      - ${LOG_PATH:-./logs}:/var/log/
      - ${SESSION_PATH:-./sessions}:/var/sessions/
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 256M

  dashboard-ui:
    build:
      target: production
      args:
        REACT_APP_API_BASE_URL: ${API_URL}
        # Limit Node.js memory during build
        NODE_OPTIONS: "--max-old-space-size=2048"
    environment:
      - NODE_ENV=production
      - WATCHPACK_POLLING=false
    # Remove development volumes but keep production cache
    volumes:
      - dashboard_ui_cache:/app/.cache
      - node_modules:/app/node_modules
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  public-ui:
    build:
      target: production
      args:
        # Limit Node.js memory during build
        NODE_OPTIONS: "--max-old-space-size=2048"
    environment:
      - NODE_ENV=production
      - WATCHPACK_POLLING=false
      - NEXT_TELEMETRY_DISABLED=1
    # No volumes needed for production standalone build
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          memory: 128M

  # Production-specific health checks and resource limits
  redis:
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          memory: 128M

  mongodb:
    # Simplified MongoDB for production testing (no authentication)
    command: mongod --noauth
    environment:
      # Explicitly disable any auth-related initialization
      - MONGO_INITDB_DATABASE=
      - MONGO_INITDB_ROOT_USERNAME=
      - MONGO_INITDB_ROOT_PASSWORD=
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 512M